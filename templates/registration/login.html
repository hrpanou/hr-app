<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare - Portal Transport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">Autentificare</h3>

                        {% if form.errors %}
                        <div class="alert alert-danger">
                            Utilizator sau parolă incorectă.
                        </div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="id_username" class="form-label">Utilizator</label>
                                <input type="text" name="username" class="form-control" id="id_username" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="id_password" class="form-label">Parolă</label>
                                <input type="password" name="password" class="form-control" id="id_password" required>
                            </div>
                            <input type="hidden" name="next" value="{{ next }}">
                            <button type="submit" class="btn btn-primary w-100">Autentificare</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
