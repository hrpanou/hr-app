<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Panou HR{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Panou HR</span>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">{{ request.user.username }}</span>
                <form action="{% url 'logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Deconectare</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="bg-white border-bottom shadow-sm">
        <div class="container-fluid">
            <ul class="nav nav-tabs border-0">
                <li class="nav-item">
                    <a class="nav-link {% if active_menu == 'dashboard' %}active{% endif %}" href="{% url 'hr_dashboard' %}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_menu == 'angajati' %}active{% endif %}" href="{% url 'hr_angajati' %}">Angajați</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_menu == 'pontaje' %}active{% endif %}" href="{% url 'hr_pontaje' %}">Pontaj</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_menu == 'concedii' %}active{% endif %}" href="{% url 'hr_concedii' %}">Concedii</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_menu == 'calendar' %}active{% endif %}" href="{% url 'hr_calendar_concedii' %}">Calendar</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_menu == 'export' %}active{% endif %}" href="{% url 'hr_export_lunar' %}">Export</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="container-fluid my-4">
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
